<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お知らせ</title>
<!--
  お知らせ枠の見本(設計書§17.5)。アプリの「文字起こしを開始」の並びの下に、高さ28pxの帯として出る。
  幅は窓の幅に合わせて伸び縮みするので、1行に収まらない分は「…」で切れる。

  守ること(アプリ側で止めているので、書いても動かない・表示されない):
  - <script> は動かない。
  - 画像・CSS・フォントは https の住所で書く(相対の住所は解決されない。http は読まれない)。
  - リンクは押すと既定のブラウザで開く。https 以外のリンクは開かない。
  - ファイルは UTF-8 で保存し、256KB 以内に収める(超えると枠ごと出ない)。
  - <iframe> は読まれない。
-->
<style>
  html, body { margin: 0; padding: 0; height: 28px; overflow: hidden; }
  body {
    font-family: "Yu Gothic UI", "Meiryo UI", "Segoe UI", sans-serif;
    font-size: 12px;
    color: #1F2328;
  }
  .band {
    box-sizing: border-box;
    height: 28px;
    padding: 0 10px;
    line-height: 26px;
    background: #EEF4FF;
    border: 1px solid #C4D6F6;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .label { font-weight: 600; margin-right: 8px; }
  a { color: #0B5FFF; }
</style>
</head>
<body>
  <div class="band">
    <span class="label">お知らせ</span>ベータ版をお使いいただきありがとうございます。不具合やご要望は
    <!-- 差し替える: 公開用のリポジトリの Issues などの住所 -->
    <a href="https://example.com/">こちら</a>からお知らせください。
  </div>
</body>
</html>
